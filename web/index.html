<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Hat in Time — Save Editor</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <h1>A Hat in Time — Save Editor</h1>
  <p><span id="file-name">no file loaded</span> <span id="file-meta"></span></p>
  <p>
    <button id="btn-open" type="button">Open .hat…</button>
    <button id="btn-revert" type="button" disabled>Revert</button>
    <button id="btn-save" type="button" disabled>Download .hat</button>
    <button id="btn-theme" type="button">Light mode</button>
  </p>
  <div id="character" hidden>
    <span>Play as</span>
    <button type="button" data-character="hat" aria-pressed="false">Hat Kid</button>
    <button type="button" data-character="bow" aria-pressed="false">Bow Kid</button>
  </div>
</header>

<div class="layout">
<nav aria-label="Categories">
  <ul id="nav"></ul>
</nav>

<main>
  <section id="empty">
    <div id="drop">
      <p>Drop a <code>.hat</code> save here</p>
      <p>or <button id="btn-open-2" type="button">choose a file</button></p>
      <p>fully local</p>
    </div>
  </section>

  <section id="editor" hidden>
    <div class="toolbar">
      <h2 id="cat-title"></h2>
      <p id="tally"></p>
      <p class="toolbar-search">
        <input type="search" id="search" placeholder="Filter…" autocomplete="off" spellcheck="false">
      </p>
      <div id="chips" role="group" aria-label="Filter"></div>
      <p class="toolbar-bulk">
        <button type="button" data-bulk="true">Select all</button>
        <button type="button" data-bulk="false">Select none</button>
      </p>
    </div>
    <p id="blurb"></p>
    <p id="banner" hidden></p>
    <div id="list"></div>
    <details id="notes">
      <summary>What this writes to the file</summary>
      <div id="notes-body"></div>
    </details>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>
</div>

<input type="file" id="file-input" accept=".hat" hidden>
<script>
(function () {
  var btn = document.getElementById('btn-theme');
  var theme = 'dark';
  try { theme = localStorage.getItem('ahit-theme') || 'dark'; } catch (e) {}
  if (theme !== 'light') theme = 'dark';
  document.documentElement.dataset.theme = theme;
  if (btn) {
    btn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
    btn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      btn.textContent = next === 'dark' ? 'Light mode' : 'Dark mode';
      try { localStorage.setItem('ahit-theme', next); } catch (e) {}
    });
  }
})();
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
